[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chaturya-workbench"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1",
  "langgraph>=1,<2", "PyYAML>=6,<7", "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1", "pypdf>=5,<7", "pypdfium2>=4,<6",
  "Pillow>=11,<13", "rank-bm25>=0.2,<1", "qdrant-client>=1.13,<2", "psutil>=6,<8"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
docling = ["docling>=2,<3"]
laya = ["laya-mlx>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["workbench*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

